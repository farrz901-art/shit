# mineru 容器编排 (独立于 rag-compose, 不集成)
#
# 用法 (4 个 profile 任选其一, 同时只能开一个):
#   docker compose -f mineru-docker-compose.yml --profile openai-server up -d
#   docker compose -f mineru-docker-compose.yml --profile api up -d
#   docker compose -f mineru-docker-compose.yml --profile router up -d
#   docker compose -f mineru-docker-compose.yml --profile gradio up -d
#
# 卷挂载 (跟 rag-docker-compose.yml 同模式: ./volumes/<service>/<dir>:<container-path>):
#   ./volumes/mineru/input    <-> /app/input       - 输入 PDF / 图片 / Office 文件
#   ./volumes/mineru/output   <-> /app/output      - 解析后的 md / 中间文件
#   ./volumes/mineru/models   <-> /root/.cache/mineru - 模型缓存 (huggingface + modelscope 默认路径, MINERU_MODEL_SOURCE=local 寻这里)
#
# 端口 (跟 rag service 防冲突):
#   mineru-api 主机侧 18000 (避免跟 rag service :8000 撞); 容器内仍监听 8000
#   其他 profile 端口 (30000 / 8002 / 7860) 都不冲突
#
# 模板来源: https://gcore.jsdelivr.net/gh/opendatalab/MinerU@master/docker/compose.yaml

name: mineru-compose

services:
  # ==================== OpenAI 兼容接口服务 ====================
  mineru-openai-server:
    image: mineru:latest
    container_name: mineru-openai-server
    restart: unless-stopped
    profiles: ["openai-server"]
    ports:
      - "30000:30000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-openai-server
    command:
      --host 0.0.0.0
      --port 30000
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    volumes:
      # 跟 rag-docker-compose.yml 风格一致: ./volumes/<service>/<dir>:<container-path>
      - ./volumes/mineru/input:/app/input # PDF / 图片 / Office 输入 (rw: 让 server-side tools 也能写)
      - ./volumes/mineru/output:/app/output # 解析产物 md + 中间文件落盘
      - ./volumes/mineru/models:/root/.cache/mineru # 模型缓存, 避免每次重新下载
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"] # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

  # ==================== Web API 服务 ====================
  mineru-api:
    image: mineru:latest
    container_name: mineru-api
    restart: unless-stopped
    profiles: ["api"]
    ports:
      # 主机侧 18000 防止跟 rag-docker-compose.yml 的 service (:8000) 撞端口; 容器内仍听 8000
      - "18000:8000"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-api
    command:
      --host 0.0.0.0
      --port 8000
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    volumes:
      - ./volumes/mineru/input:/app/input
      - ./volumes/mineru/output:/app/output
      - ./volumes/mineru/models:/root/.cache/mineru
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"] # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

  # ==================== Router 服务 (统一入口, 可聚合多个 mineru-api 后端) ====================
  mineru-router:
    image: mineru:latest
    container_name: mineru-router
    restart: unless-stopped
    profiles: ["router"]
    ports:
      - "8002:8002"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-router
    command:
      --host 0.0.0.0
      --port 8002
      --local-gpus auto
      # --allow-public-http-client  # Disabled by default; when binding to 0.0.0.0 or ::, this re-enables *-http-client backends and server_url. Enable only if you accept the SSRF risk.
      # To aggregate existing mineru-api services instead of starting local workers:
      # --local-gpus none
      # --upstream-url http://mineru-api:8000
      # --upstream-url http://mineru-api-2:8000
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    volumes:
      - ./volumes/mineru/input:/app/input
      - ./volumes/mineru/output:/app/output
      - ./volumes/mineru/models:/root/.cache/mineru
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"] # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]

  # ==================== Gradio WebUI 服务 (给人用浏览器玩) ====================
  mineru-gradio:
    image: mineru:latest
    container_name: mineru-gradio
    restart: unless-stopped
    profiles: ["gradio"]
    ports:
      - "7860:7860"
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: mineru-gradio
    command:
      --server-name 0.0.0.0
      --server-port 7860
      # --enable-api false  # If you want to disable the API, set this to false
      # --max-convert-pages 20  # If you want to limit the number of pages for conversion, set this to a specific number
      # parameters for vllm-engine
      # --gpu-memory-utilization 0.5  # If encountering VRAM shortage, reduce the KV cache size by this parameter; if VRAM issues persist, try lowering it further to `0.4` or below.
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    volumes:
      - ./volumes/mineru/input:/app/input
      - ./volumes/mineru/output:/app/output
      - ./volumes/mineru/models:/root/.cache/mineru
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"] # Modify for multiple GPUs: ["0", "1"]
              capabilities: [gpu]
