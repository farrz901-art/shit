name: CI

on:
  push:
    branches: [master, "code-quality-*"]
  pull_request:
    branches: [master]

env:
  # 后端 env defaults (CI 用独立 test DB, 跟 dev/prod 隔离)
  PG_HOST: localhost
  PG_PORT: 5432
  PG_USER: postgres
  PG_PASSWORD: postgres
  PG_DATABASE: rag_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379

jobs:
  backend:
    runs-on: ubuntu-latest
    # CI 起真实 PostgreSQL + pgvector + Redis, 集成测试可连
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/service
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 同步依赖
        run: uv sync

      # ruff format + check 验证代码格式化 + 代码风格
      - name: ruff format 检查
        run: uv run ruff format --check .

      - name: ruff lint 检查
        run: uv run ruff check .

      - name: pyright 类型检查
        run: uv run pyright

      # Alembic migration: 在 CI PG 上建表, 验证迁移可执行
      - name: alembic 迁移
        run: uv run alembic upgrade head
        env:
          RAG_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rag_test

      # 跑测试: 默认跳过 integration (用-m "not integration").
      # 如需跑集成测试: uv run pytest -m integration
      - name: 测试 + 覆盖率
        run: uv run pytest --cov=src --cov-report=term --cov-fail-under=0
        env:
          RAG_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rag_test

      # coverage 报告留作 artifact
      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: packages/service/htmlcov/
          retention-days: 7

  # Slow 测试: 默认 conftest 跳过的 @pytest.mark.slow 套件
  # (camelot 35MB PDF / mineru Docker e2e / API 契约扫描等, 单测 30s ~ 3 分钟)
  # 共享 backend job 的 PG/Redis services, 不重复定义
  # continue-on-error: slow 涉及 docker/GPU, CI runner 偶发不稳, 磨合期失败不阻塞 PR
  slow:
    runs-on: ubuntu-latest
    needs: backend
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/service
    steps:
      - uses: actions/checkout@v7

      - name: 安装 uv
        uses: astral-sh/setup-uv@v7

      - name: 同步依赖
        run: uv sync

      - name: 跑 slow 测试
        run: uv run pytest -m slow --no-cov -v
        env:
          RAG_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rag_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v7

      - name: 安装 bun
        uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        run: bun install

      - name: oxfmt 格式检查
        run: bun run format:check

      - name: oxlint lint 检查
        run: bun run lint

      - name: tsc 类型检查
        run: bun run typecheck

      - name: vitest 测试
        run: bun run test

      - name: 代码重复度检测 (jscpd — 前端)
        run: bun run check-duplicates:fe
      - name: 代码重复度检测 (jscpd — 后端)
        run: bun run check-duplicates:py
      - name: 生成重复代码报告
        run: bun run find-duplicates

      - name: vitest 覆盖率
        run: bun run test:coverage

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: packages/web/coverage/
          retention-days: 7
